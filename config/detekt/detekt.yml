# Detekt configuration for NoCapFit (Compose project)
# Only overrides — defaults are inherited via buildUponDefaultConfig = true

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 12
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInFiles: 15
    ignoreAnnotated:
      - 'Preview'
  ComplexCondition:
    threshold: 5

formatting:
  active: true
  autoCorrect: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

coroutines:
  active: true

style:
  ReturnCount:
    max: 3
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated:
      - 'Composable'
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'
      - 'Composable'
  ForbiddenComment:
    active: false
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
    excludeImports:
      - 'kotlinx.coroutines.*'
